apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-feed-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: news-feed-frontend
  template:
    metadata:
      labels:
        app: news-feed-frontend
    spec:
      containers:
      - name: frontend
        image: news-feed-frontend:latest
        ports:
        - containerPort: 5173
        env:
        - name: VITE_API_URL
          value: "http://news-feed-backend:3001/api"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-feed-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: news-feed-backend
  template:
    metadata:
      labels:
        app: news-feed-backend
    spec:
      containers:
      - name: backend
        image: news-feed-backend:latest
        ports:
        - containerPort: 3001
        env:
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/news-feed"
        - name: NODE_ENV
          value: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-pvc 