apiVersion: v1
kind: Service
metadata:
  name: news-feed-frontend
spec:
  selector:
    app: news-feed-frontend
  ports:
  - port: 80
    targetPort: 5173
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: news-feed-backend
spec:
  selector:
    app: news-feed-backend
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
  type: ClusterIP 